  @font-face{font-family:"Great Vibes";src:url(fonts/greatvibes.woff2) format("woff2");font-display:swap}
  @font-face{font-family:"Pinyon Script";src:url(fonts/pinyon.woff2) format("woff2");font-display:swap}
  @font-face{font-family:"Cormorant Garamond";font-weight:400;src:url(fonts/corm-400-normal.woff2) format("woff2");font-display:swap}
  @font-face{font-family:"Cormorant Garamond";font-weight:500;src:url(fonts/corm-500-normal.woff2) format("woff2");font-display:swap}
  @font-face{font-family:"Cormorant Garamond";font-weight:600;src:url(fonts/corm-600-normal.woff2) format("woff2");font-display:swap}
  @font-face{font-family:"Cormorant Garamond";font-style:italic;font-weight:400;src:url(fonts/corm-400-italic.woff2) format("woff2");font-display:swap}
  @font-face{font-family:"Cormorant Garamond";font-style:italic;font-weight:500;src:url(fonts/corm-500-italic.woff2) format("woff2");font-display:swap}
  @font-face{font-family:"Cormorant SC";font-weight:500;src:url(fonts/cormsc-500.woff2) format("woff2");font-display:swap}

<style>
  :root{
    --bg:#F8F5F2;         /* soft canvas */
    --card:#FFFFFF;
    --ink:#3F3A4E;
    --rose:#8A3F72;       /* orchid plum: headings + buttons */
    --pink:#E7A3BA;  --pink-wash:#F6E9F1;   /* orchid blush */
    --butter:#B9A6D3; --butter-wash:#EEE8F5; /* lilac */
    --sky:#A9C6CF;   --sky-wash:#E7F0F2;    /* water */
    --leaf:#8FA987;
    --muted:#706A80;
    --line:#E8DEE7;
    --radius-lg:28px; --radius-sm:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font:400 17px/1.6 "Mulish",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
  /* soft colour clouds behind everything */
  /* the Monet painting, faded, behind the whole page */
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:linear-gradient(rgba(248,245,242,.80),rgba(248,245,242,.86)),url(monet.jpg) center/cover no-repeat}
  .page{max-width:460px;margin:0 auto;padding:0 16px 40px;position:relative}
  h2{font:500 italic 36px/1.1 "Cormorant Garamond",Georgia,serif;color:var(--rose);margin:0 0 18px;text-align:center}
  p{margin:0 0 12px}
  button{font:inherit;cursor:pointer}
  :focus-visible{outline:3px solid var(--rose);outline-offset:3px;border-radius:6px}

  .lang{position:fixed;top:12px;right:12px;z-index:5;display:flex;background:rgba(255,255,255,.9);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:999px;padding:3px}
  .lang{transition:opacity .3s,transform .3s}
  .lang.away{opacity:0;transform:translateY(-12px);pointer-events:none}
  .lang button{border:0;background:none;padding:5px 11px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted)}
  .lang button[aria-pressed="true"]{background:var(--rose);color:#fff}
  .demo-banner{background:var(--sky-wash);color:#3D5F86;font-size:13px;text-align:center;padding:8px 96px 8px 12px}

  /* hero */
  .hero{position:relative;text-align:center;margin:0 -16px;padding:0 16px 36px;overflow:hidden;
    background:url(monet.jpg) center 30%/cover no-repeat;
    -webkit-mask-image:linear-gradient(#000 80%,transparent);mask-image:linear-gradient(#000 80%,transparent)}
  .hero::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(70% 46% at 50% 56%,rgba(250,247,244,.92) 0%,rgba(250,247,244,.78) 55%,rgba(250,247,244,.18) 100%)}
  .hero > *{position:relative}
  .garland{width:calc(100% + 32px);max-width:480px;height:auto;display:block;margin:0 -16px -6px}
  .hero .garland{margin:0 -16px -120px}
  .bismillah{font-family:"Amiri",serif;font-size:26px;color:var(--rose);margin:4px 0 4px}
  .walimah{font-size:15px;letter-spacing:.04em;color:#5F7D5B;font-weight:700;margin-bottom:6px}
  .names{font:400 italic 66px/0.95 "Cormorant Garamond",Georgia,serif;color:var(--rose);margin:4px 0 14px}
  .names .amp{display:block;font-size:36px;color:#B8955A;margin:4px 0}
  .date-line{font:600 22px/1.3 "Cormorant Garamond",serif;color:var(--ink)}
  .divider{display:block;width:150px;height:30px;margin:18px auto 0}

  section{margin-top:40px}
  .card{position:relative;background:var(--card);border-radius:var(--radius-lg);padding:28px 22px;box-shadow:0 1px 0 var(--line),0 14px 34px -20px rgba(90,60,110,.32)}
  .spray{position:absolute;width:118px;height:auto;pointer-events:none}
  .spray.tr{top:-34px;right:-14px}
  .spray.bl{bottom:-30px;left:-14px;transform:scaleX(-1) rotate(180deg)}
  .spray.tl{top:-34px;left:-14px;transform:scaleX(-1)}

  .invite{text-align:center;padding-top:44px}
  .invite .to{color:var(--muted);font-size:15px;margin-bottom:2px}
  .invite .guest{font:600 30px/1.2 "Cormorant Garamond",serif;color:var(--rose);margin-bottom:14px}
  .invite .salam{font-weight:600;margin-bottom:4px}
  .invite .lead{color:var(--muted);font-size:15px;line-height:1.55;margin:0 auto 12px;max-width:320px}
  .parents{margin:4px 0 16px;font:600 23px/1.3 "Cormorant Garamond",serif;color:var(--ink)}
  .parents span,.couple span{display:block}
  .parents .amp,.couple .amp{font:italic 500 20px/1.4 "Cormorant Garamond",serif;color:#C9A15A}
  .honor{font-size:12.5px;letter-spacing:.04em;color:var(--muted);margin:0 0 4px}
  .honor:empty{display:none}
  .couple{margin:6px 0 4px;font:400 31px/1.3 "Pinyon Script",cursive;color:var(--rose)}
  .couple .amp{margin:2px 0}
  .note{margin-top:16px;background:var(--butter-wash);border-radius:var(--radius-sm);padding:12px 14px;color:#5E4A78;font-size:15px}

  .count{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
  .count div{text-align:center;padding:12px 0 8px;border-radius:16px}
  .count div:nth-child(1){background:var(--pink-wash)}
  .count div:nth-child(2){background:var(--butter-wash)}
  .count div:nth-child(3){background:var(--sky-wash)}
  .count div:nth-child(4){background:var(--pink-wash)}
  .count b{display:block;font:600 32px/1 "Cormorant Garamond",serif;color:var(--rose)}
  .count span{font-size:12px;color:var(--muted)}

  .sched{list-style:none;margin:0;padding:0}
  .sched li{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line);align-items:baseline}
  .sched li:last-child{border-bottom:0}
  .sched time{white-space:nowrap;font:600 19px/1.3 "Cormorant Garamond",serif;color:var(--rose)}
  .sched .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:9px;vertical-align:1px}

  .loc{text-align:center;padding-top:40px}
  .seal-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 0}
  .seal{width:118px;height:118px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#E9DDF3,#C5B3DD 70%);box-shadow:inset 0 0 0 5px #fff,inset 0 0 0 8px #D8C59A,0 12px 26px -12px rgba(110,60,120,.55);display:grid;place-items:center}
  .seal svg{width:82px;height:82px}
  .area{display:inline-flex;align-items:center;gap:6px;font:600 24px/1.2 "Cormorant Garamond",serif;color:var(--rose)}
  .area svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8}
  .seal-text{color:var(--muted);font-size:15px;max-width:280px}
  .seal-blur{display:block;filter:blur(5px);opacity:.5;user-select:none;font:600 22px "Cormorant Garamond",serif;color:var(--rose)}
  .venue-name{font:600 30px/1.15 "Cormorant Garamond",serif;color:var(--rose);margin-bottom:6px}
  .venue-addr{color:var(--muted);margin-bottom:20px}
  .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:16px;border:1.5px solid var(--rose);background:#fff;color:var(--rose);font-weight:700;font-size:16px;text-decoration:none;padding:0 14px}
  .btn.primary{background:var(--rose);color:#fff}
  .btn.ghost{border-color:var(--line);color:var(--muted);font-weight:600}
  .btn:disabled{opacity:.55;cursor:default}
  .btn.full{width:100%;margin-top:10px}
  .unseal .seal{animation:seal-off .7s ease-in forwards}
  .unseal .venue{animation:rise .6s .35s ease-out both}
  @keyframes seal-off{to{transform:scale(1.3) rotate(30deg);opacity:0}}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  fieldset{border:0;margin:0 0 22px;padding:0}
  legend{font-weight:700;margin-bottom:10px;padding:0}
  .choice{display:grid;gap:10px}
  .choice.two{grid-template-columns:1fr 1fr}
  .opt{position:relative}
  .opt input{position:absolute;opacity:0;inset:0}
  .opt span{display:flex;align-items:center;justify-content:center;text-align:center;min-height:54px;padding:8px 12px;border:1.5px solid var(--line);border-radius:16px;font-weight:600;background:#fff;transition:border-color .15s,background .15s}
  .opt input:checked + span{border-color:var(--rose);background:var(--pink-wash);color:var(--rose)}
  .opt input:focus-visible + span{outline:3px solid var(--rose);outline-offset:2px}
  .stepper{display:flex;align-items:center;justify-content:space-between;border:1.5px solid var(--line);border-radius:16px;padding:6px;background:#fff}
  .stepper button{width:48px;height:48px;border-radius:12px;border:0;background:var(--sky-wash);color:#3D5F86;font-size:24px;font-weight:700}
  .stepper output{font:600 30px "Cormorant Garamond",serif;color:var(--rose);min-width:60px;text-align:center}
  .hint{font-size:14px;color:var(--muted);margin-top:6px}
  .err{color:#B3261E;font-size:14px;margin-top:10px;min-height:1em}
  .summary{text-align:center}
  .summary .big{font:600 27px/1.25 "Cormorant Garamond",serif;color:var(--rose);margin-bottom:8px}

  .hidden{display:none !important}
  footer{text-align:center;margin-top:36px;color:var(--muted);font-size:14px}
  footer .doa{font:italic 500 20px/1.4 "Cormorant Garamond",serif;color:var(--rose);margin:6px 0 10px}
  footer .garland{transform:scaleY(-1);margin-top:0}

  /* ---------- envelope cover ---------- */
  body.locked{overflow:hidden}
  .envelope{position:fixed;inset:0;z-index:20;overflow:hidden;transition:opacity .9s ease}
  .envelope.done{opacity:0;pointer-events:none}
  .cv-bg{position:absolute;inset:0;background:#6d6a72 url(img/lilacpond.jpg) center/cover no-repeat;transform:scale(1.04);transition:transform 4s ease}
  .opening .cv-bg{transform:scale(1.12)}
  .cv-bg::after{content:"";position:absolute;inset:0;background:
    radial-gradient(70% 14% at 50% 24%,rgba(25,18,30,.45),transparent),
    radial-gradient(80% 10% at 50% 86%,rgba(25,18,30,.45),transparent),
    linear-gradient(rgba(0,0,0,.2),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 70%,rgba(0,0,0,.3))}
  .cv-inner{position:relative;height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;color:#fff;text-align:center}
  .cv-label{font:500 15px/1 "Cormorant SC",serif;letter-spacing:.18em;text-shadow:0 1px 10px rgba(0,0,0,.4)}
  .cv-names{font:400 44px/1.15 "Pinyon Script",cursive;margin:10px 0 28px;text-shadow:0 2px 16px rgba(0,0,0,.4)}
  .cv-to{margin-top:30px;font:500 15px/1.4 "Cormorant SC",serif;letter-spacing:.12em;text-shadow:0 1px 10px rgba(0,0,0,.45)}
  .cv-to b{display:block;font:500 italic 24px/1.3 "Cormorant Garamond",serif;letter-spacing:0;margin-top:2px}
  .cv-open{margin-top:22px;min-height:46px;padding:0 26px;border-radius:999px;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.08);
    color:#fff;font:600 14px/1 "Cormorant SC",serif;letter-spacing:.18em;backdrop-filter:blur(2px);text-shadow:0 1px 8px rgba(0,0,0,.4)}
  .cv-to,.cv-open,.cv-label,.cv-names{transition:opacity .6s ease}
  .opening .cv-to,.opening .cv-open{opacity:0}
  .opening .cv-label,.opening .cv-names{opacity:0;transition-delay:1.6s}
  /* the envelope itself */
  .env3d{position:relative;width:min(84vw,340px);aspect-ratio:340/230;border:0;padding:0;background:none;cursor:pointer;perspective:1100px;
    filter:drop-shadow(0 18px 24px rgba(0,0,0,.35)) drop-shadow(0 3px 5px rgba(0,0,0,.2));transition:transform 1.2s cubic-bezier(.3,.7,.3,1) 1.2s}
  .opening .env3d{transform:translateY(16%)}
  .env3d > *{position:absolute}
  .e-back,.e-front{inset:0;width:100%;height:100%}
  .e-back{z-index:1}.e-front{z-index:3}
  .e-card{z-index:2;left:17%;width:66%;top:5%;height:94%;transition:transform 1.4s cubic-bezier(.3,.6,.25,1) 1.45s}
  .e-card svg{width:100%;height:100%;overflow:visible}
  .opening .e-card{transform:translateY(-78%)}
  .e-flap{z-index:4;left:0;top:0;width:100%;height:68%;transform-origin:50% 0;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.5,0,.3,1) .45s}
  .e-flap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .e-flap .f-back{transform:rotateX(180deg)}
  .opening .e-flap{transform:rotateX(180deg);animation:flap-behind 1.1s linear .45s forwards}
  @keyframes flap-behind{0%,55%{z-index:4}56%,100%{z-index:1}}
  .pearl{transition:opacity .4s ease,transform .4s ease;transform-box:fill-box;transform-origin:center}
  .opening .pearl{opacity:0;transform:scale(.4) translateY(-10px)}
  /* video envelope (real 3D render) */
  .cv-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;background:#6d6a72 url(envelope.jpg) center/cover no-repeat}
  .has-video .cv-video{display:block}
  .has-video .cv-bg{display:none}
  .has-video .cv-inner{display:block;padding:0}
  .has-video .cv-top{position:absolute;left:16px;right:16px;top:19%}
  .has-video .cv-bottom{position:absolute;left:16px;right:16px;top:71%}
  .has-video .env3d{position:absolute;left:10%;top:36%;width:80%;height:33%;aspect-ratio:auto;opacity:0;filter:none}
  .has-video .cv-to{margin-top:0}
  .playing .cv-top,.playing .cv-bottom{opacity:0;transition:opacity .5s ease}
  .cv-top,.cv-bottom{transition:opacity .5s ease}
  .has-video::after{content:"";position:absolute;inset:0;pointer-events:none;background:
    radial-gradient(70% 12% at 50% 23%,rgba(25,18,30,.42),transparent),radial-gradient(80% 10% at 50% 79%,rgba(25,18,30,.42),transparent);transition:opacity .5s}
  .playing::after{opacity:0}
  @media (prefers-reduced-motion:reduce){.e-flap,.e-card,.env3d,.cv-bg{transition-duration:.01s !important;transition-delay:0s !important}}

  /* ---------- floating menu ---------- */
  .dock{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:8;
    width:min(440px,calc(100% - 20px));display:grid;grid-template-columns:repeat(5,1fr);padding:7px 6px 8px;border-radius:22px;
    background:linear-gradient(135deg,#9A5185 0%,#7E4A84 50%,#5F5F8F 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 0 0 1px rgba(226,196,135,.55),0 14px 30px -12px rgba(70,40,90,.6);
    animation:dock-in .7s cubic-bezier(.2,.8,.2,1) both}
  .dock::before{content:"";position:absolute;left:18%;right:18%;top:0;height:1px;background:linear-gradient(90deg,transparent,#F1DCA6,transparent)}
  .dock button,.dock a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;border:0;border-radius:15px;
    background:none;color:#FFF3F7;text-decoration:none;font:600 11px/1 "Mulish",sans-serif;letter-spacing:.02em;transition:background .25s,transform .2s}
  .dock button:active,.dock a:active{transform:scale(.94)}
  .dock .on{background:rgba(255,255,255,.18)}
  .dock svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .dock :focus-visible{outline:2px solid #F1DCA6;outline-offset:1px}
  @keyframes dock-in{from{opacity:0;transform:translate(-50%,30px)}to{opacity:1;transform:translate(-50%,0)}}
  /* music icon turns into moving bars while playing */
  .eq{display:none;align-items:flex-end;gap:2.5px;height:22px;padding-bottom:3px}
  .eq i{display:block;width:3px;height:6px;border-radius:2px;background:currentColor;animation:eq 1s ease-in-out infinite}
  .eq i:nth-child(2){animation-delay:-.4s}.eq i:nth-child(3){animation-delay:-.7s}.eq i:nth-child(4){animation-delay:-.2s}
  @keyframes eq{0%,100%{height:5px}50%{height:17px}}
  #musicBtn[aria-pressed="true"] .eq{display:flex}
  #musicBtn[aria-pressed="true"] .note-ic{display:none}
  .music-fab{position:fixed;left:12px;top:12px;z-index:9;width:42px;height:42px;border-radius:50%;border:1px solid rgba(226,196,135,.7);
    background:rgba(255,255,255,.9);backdrop-filter:blur(6px);color:var(--rose);display:grid;place-items:center;box-shadow:0 6px 16px -8px rgba(120,35,70,.5)}
  .music-fab svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .music-fab .eq{height:18px;padding-bottom:1px}
  .music-fab[aria-pressed="true"]{background:var(--rose);color:#fff;border-color:#E2C487}
  .sheet-bg{position:fixed;inset:0;z-index:30;background:rgba(70,30,50,.35);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;animation:fade-in .25s ease}
  .sheet{width:min(460px,100%);background:#fff;border-radius:26px 26px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px -10px rgba(120,35,70,.4);animation:sheet-up .35s cubic-bezier(.2,.8,.2,1)}
  .sheet-grip{width:42px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 14px}
  .sheet h3{font:500 italic 30px/1.1 "Cormorant Garamond",serif;color:var(--rose);text-align:center;margin:0 0 14px}
  .contacts{list-style:none;margin:0 0 6px;padding:0}
  .contacts li{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px dashed var(--line)}
  .contacts li:last-child{border-bottom:0}
  .contacts .who{flex:1;min-width:0}
  .contacts .who b{display:block;font-weight:700;color:var(--ink)}
  .contacts .who span{font-size:13px;color:var(--muted)}
  .contacts a{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;text-decoration:none;flex:none}
  .contacts a svg{width:21px;height:21px}
  .contacts .wa{background:#E7F6EC;color:#1E8E4E}
  .contacts .call{background:var(--pink-wash);color:var(--rose)}
  @keyframes sheet-up{from{transform:translateY(100%)}to{transform:none}}
  @keyframes fade-in{from{opacity:0}to{opacity:1}}
  .yt-music{position:fixed;left:-400px;top:-400px;width:200px;height:200px;opacity:0;pointer-events:none}

  /* ---------- reveal animations ---------- */
  .reveal{opacity:0;transform:translateY(26px);transition:opacity 1s ease,transform 1s cubic-bezier(.2,.7,.2,1),filter 1s ease}
  .reveal.in{opacity:1;transform:none}
  .reveal.soft{transform:none;filter:blur(10px);letter-spacing:.06em}
  .reveal.soft.in{filter:none;letter-spacing:normal}
  .reveal.zoom{transform:scale(.9)}
  .reveal.zoom.in{transform:none}
  .hero .garland.in{animation:sway 9s ease-in-out 1.2s infinite}
  @keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(.8deg) translateY(2px)}}
  .ornament{display:block;width:180px;height:22px;margin:-6px auto 18px}

  .in .ornament .d,.ornament.in .d{stroke-dashoffset:0}
  .ornament .gem{fill:#D9B36C;stroke:none;opacity:0;transform-origin:90px 11px;transform:scale(.2) rotate(45deg);transition:all .7s ease 1s}
  .in .ornament .gem,.ornament.in .gem{opacity:1;transform:scale(1) rotate(45deg)}
  .spark{position:fixed;bottom:-10px;z-index:3;width:4px;height:4px;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,#FFF4CF 0%,#E2BE73 60%,transparent 70%);box-shadow:0 0 6px 1px rgba(232,200,120,.6);animation:spark-rise linear infinite}
  @keyframes spark-rise{0%{transform:translate(0,0);opacity:0}10%{opacity:.9}90%{opacity:.7}100%{transform:translate(var(--dx),-105vh);opacity:0}}

  .credit{font-size:11px;color:#B3A7B8;margin-top:14px}
  .page{padding-bottom:120px}

  /* ---------- falling petals ---------- */
  .petal{position:fixed;top:-24px;z-index:4;pointer-events:none;border-radius:70% 0 70% 0;opacity:.85;animation:fall linear infinite}
  @keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx),110vh) rotate(var(--rot))}}

  /* ---------- gallery ---------- */
  .gallery{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -22px;padding:0 22px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .gallery::-webkit-scrollbar{display:none}

  /* ---------- ucapan ---------- */

  .wishes .empty{text-align:center;color:var(--muted);background:none;font-style:italic}
  .field{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font:inherit;color:var(--ink);background:#fff;margin-bottom:10px}
  .field:focus{outline:none;border-color:var(--rose)}
  textarea.field{min-height:96px;resize:vertical}
  .ok{color:#3E7A3A;font-size:14px;margin-top:10px;min-height:1em}
  .state{min-height:70vh;display:grid;place-items:center;text-align:center;color:var(--muted);padding:24px}
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

  /* ================= Lilac Pond theme ================= */
  :root{--bg:#F5F0EF;--ink:#4E3C55;--rose:#6E4A75;--gold:#B99A6A;--cream:#F7F2EF;--muted:#776E7E;--line:#E6DCE0}

  .bismillah{color:#fff;font-size:28px;text-shadow:0 1px 10px rgba(0,0,0,.4)}

  .names .amp{font:400 42px/1 "Pinyon Script",cursive;color:#F1DCA6;margin:2px 0}
  .date-line{font:500 17px/1.4 "Cormorant SC",serif;letter-spacing:.18em;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.45)}

  .couple{color:var(--ink)}
  .honor{font-family:"Cormorant SC",serif;font-size:12.5px;letter-spacing:.03em;white-space:nowrap}
  /* countdown */
  .count div{background:transparent !important;border:1px solid rgba(185,154,106,.5);border-radius:4px}

  /* date, time and the winding itinerary */
  .itin{margin:48px -16px 0}
  .itin-cream{background:var(--cream);text-align:center;padding:40px 24px 54px;color:var(--ink)}
  .itin-cream h2{margin:0 0 8px}
  .itin-cream .sc{font:500 17px/1.6 "Cormorant SC",serif;letter-spacing:.14em;color:#6A5A70;margin:0 0 26px}

  .itin-line{position:absolute;inset:0;width:100%;height:100%}
  .stops{list-style:none;margin:0;padding:0}
  .stops li{position:absolute;text-align:center;color:#fff;font:italic 500 21px/1.25 "Cormorant Garamond",serif;text-shadow:0 1px 3px rgba(0,0,0,.35),0 1px 14px rgba(0,0,0,.55)}

  /* footer: back to the painting */
  footer{position:relative;margin:56px -16px 0;padding:90px 24px 150px;color:#fff;background:#6d6a72 url(img/lilacpond.jpg) center 70%/cover no-repeat}

  .dock{background:linear-gradient(135deg,#7E5A86 0%,#68507A 55%,#56506F 100%)}

  /* ================= round 2: paper, lace, painted orchids ================= */
  body{background:#F3EDE6 url(img/paper.jpg) repeat;background-size:600px}
  .page{padding:0 30px}

  .couple span{display:block;white-space:nowrap}

  /* date, time and location: one seamless section */
  .details{position:relative;text-align:center;margin-top:56px;padding:6px 0 4px}
  .details h2{margin:26px 0 6px}
  .details > h2:first-of-type{margin-top:0}
  .details .sc{font:500 17px/1.6 "Cormorant SC",serif;letter-spacing:.14em;color:#6A5A70;margin:0}

  /* RSVP */
  #rsvp{margin-top:48px}
  .stepper button:disabled{opacity:.35;cursor:default}
  /* programme over the painting */
  .itin{margin:56px -30px 0}
  .itin > h2{text-align:center;margin:0 0 4px}
  .itin .ornament{margin-bottom:14px}
  .itin .lace-sep{margin:0}

/* ---------- lace envelope ---------- */
// lay little lace scallops along a path, pointing away from the point 'away'
function laceAlong(pathD, group, away, step, size) {
  const NS = "http://www.w3.org/2000/svg";
  const p = document.createElementNS(NS, "path"); p.setAttribute("d", pathD);
  group.appendChild(p);
  const L = p.getTotalLength();
  for (let d = step / 2; d < L; d += step) {
    const a = p.getPointAtLength(Math.max(0, d - 1)), b = p.getPointAtLength(Math.min(L, d + 1)), c = p.getPointAtLength(d);
    let tx = b.x - a.x, ty = b.y - a.y; const m = Math.hypot(tx, ty) || 1; tx /= m; ty /= m;
    let nx = -ty, ny = tx;
    if ((c.x - away[0]) * nx + (c.y - away[1]) * ny < 0) { nx = -nx; ny = -ny; }
    const u = document.createElementNS(NS, "use");
    u.setAttribute("href", "#lace"); u.setAttribute("width", size); u.setAttribute("height", size * 16 / 24);
    u.setAttribute("x", -size / 2); u.setAttribute("y", 0);
    u.setAttribute("transform", `translate(${c.x} ${c.y}) rotate(${Math.atan2(ny, nx) * 180 / Math.PI - 90})`);
    group.appendChild(u);
  }
  p.remove();
}

function setupReveals() {
  // gold ornament under every section title
  document.querySelectorAll("#app h2").forEach(h => {

/* place each itinerary stop on whichever side of the winding line has room */
function layoutStops() {
  const box = $("itinPaint"); if (!box) return;
  const W = box.clientWidth, H = box.clientHeight, sx = W / 390, sy = H / 464;
  $("itinLine").setAttribute("viewBox", `0 0 ${W} ${H}`);
  $("wind").setAttribute("transform", `scale(${sx} ${sy})`);
  const p = $("wind"), L = p.getTotalLength(), pts = [];
  for (let i = 0; i <= 300; i++) { const q = p.getPointAtLength(L * i / 300); pts.push({ x: q.x * sx, y: q.y * sy }); }
  const items = [...$("schedule").children], n = items.length;
  items.forEach((el, i) => {
    const ty = H * (n === 1 ? .5 : 0.15 + 0.7 * i / (n - 1));
    const c = pts.reduce((m, q) => Math.abs(q.y - ty) < Math.abs(m.y - ty) ? q : m);
    const w = Math.min(180, W * 0.46); el.style.width = w + "px";
    const cx = c.x < W / 2 ? (c.x + W) / 2 : c.x / 2;
    el.style.left = Math.max(6, Math.min(W - w - 6, cx - w / 2)) + "px";
    el.style.top = (ty - el.offsetHeight / 2) + "px";
  });
}

    const li = document.createElement("li");

    const b = document.createElement("b"); b.textContent = c.name;
    const sp = document.createElement("span"); sp.textContent = `${c[lang]} · ${c.phone}`;
    who.append(b, sp);
    const wa = document.createElement("a"); wa.className = "wa"; wa.href = `https://wa.me/${intl}`; wa.target = "_blank"; wa.rel = "noopener";
    wa.setAttribute("aria-label", `WhatsApp ${c.name}`);
    wa.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 2.9 2.9 0 0 0-.9 2.2 5 5 0 0 0 1.1 2.7 11.5 11.5 0 0 0 4.4 3.9c1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.2-.2-.4-.3z"/></svg>';
    const call = document.createElement("a"); call.className = "call"; call.href = `tel:+${intl}`;
    call.setAttribute("aria-label", `${t("call")} ${c.name}`);
    call.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h3.2l1.6 4-2 1.3a11 11 0 0 0 5 5l1.3-2 4 1.6V17a2 2 0 0 1-2 2A15 15 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>';
    li.append(who, wa, call); ul.appendChild(li);
  });
}
function openContacts() { renderContacts(); $("contactSheet").classList.remove("hidden"); $("contactClose").focus(); }
function closeContacts() { $("contactSheet").classList.add("hidden"); $("contactBtn").focus(); }
$("contactBtn").addEventListener("click", openContacts);
$("contactClose").addEventListener("click", closeContacts);
$("contactSheet").addEventListener("click", (e) => { if (e.target === $("contactSheet")) closeContacts(); });
addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("contactSheet").classList.contains("hidden")) closeContacts(); });

/* menu: jump to a section */
document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () =>
  $(b.dataset.go).scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" })));

/* ---------- gallery ---------- */
let galleryBuilt = false;
function renderGallery() {
  const g = $("gallery"), dots = $("dots");
  const tints = ["var(--pink-wash)", "var(--butter-wash)", "var(--sky-wash)"];
  const flowers = ["#FFFFFF", "#E6D8F2", "#F6E4EE"];
  if (!CONFIG.photos.length || !galleryBuilt) {
    g.innerHTML = ""; dots.innerHTML = "";
    const items = CONFIG.photos.length ? CONFIG.photos : [0, 1, 2];
    items.forEach((src, i) => {
      const f = document.createElement("figure");
      if (typeof src === "string") {
        const img = document.createElement("img"); img.src = src; img.loading = "lazy";
        img.alt = `${CONFIG.bride} & ${CONFIG.groom} ${i + 1}`; f.appendChild(img);
      } else {
        f.style.background = tints[i % 3];
        f.innerHTML = `<div class="ph"><img src="img/orchids/${["lily_a", "lily_b", "lily_a"][i % 3]}.png" alt=""><span></span></div>`;
      }
      g.appendChild(f);
      const d = document.createElement("button"); d.type = "button"; d.setAttribute("aria-label", `${i + 1}`);
      d.addEventListener("click", () => g.scrollTo({ left: f.offsetLeft - g.offsetLeft - 22, behavior: "smooth" }));
      dots.appendChild(d);
    });
    galleryBuilt = true;
    updateDots();
  }
  g.querySelectorAll(".ph span").forEach(s => s.textContent = t("photoSoon"));
}
function updateDots() {
  const g = $("gallery"), figs = g.querySelectorAll("figure");
  if (!figs.length) return;
  const step = figs[0].offsetWidth + 10;
  const idx = Math.round(g.scrollLeft / step);
  $("dots").querySelectorAll("button").forEach((d, i) => d.setAttribute("aria-current", i === idx));
}
$("gallery").addEventListener("scroll", () => requestAnimationFrame(updateDots), { passive: true });

/* ---------- ucapan (wishes) ---------- */
let wishes = [];
function renderWishes() {
  const ul = $("wishes"); ul.innerHTML = "";
  if (!wishes.length) { const li = document.createElement("li"); li.className = "empty"; li.textContent = t("wishesEmpty"); ul.appendChild(li); return; }
  wishes.forEach(w => {
    const li = document.createElement("li");
    const who = document.createElement("div"); who.className = "who"; who.textContent = w.name;
    const when = document.createElement("span"); when.className = "when";
    when.textContent = new Date(w.created_at).toLocaleDateString(t("locale"), { day: "numeric", month: "short" });
    who.appendChild(when);
    const msg = document.createElement("p"); msg.className = "msg"; msg.textContent = w.message;
    li.append(who, msg); ul.appendChild(li);
  });
}
async function loadWishes() {
  try {
    if (demo) wishes = DEMO_WISHES;
    else { const { data, error } = await sb.rpc("get_wishes", { p_token: token }); if (!error && data) wishes = data; }
  } catch {}
  renderWishes();
}
$("wishForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("wishErr").textContent = ""; $("wishOk").textContent = "";
  const name = $("wishName").value.trim(), message = $("wishMsg").value.trim();
  if (!name || !message) { $("wishErr").textContent = t("wishNeed"); return; }
  $("wishBtn").disabled = true;
  try {
    if (demo) { DEMO_WISHES = [{ name, message, created_at: new Date().toISOString() }, ...DEMO_WISHES]; wishes = DEMO_WISHES; }
    else {
      const { data, error } = await sb.rpc("add_wish", { p_token: token, p_name: name, p_message: message });
      if (error) throw error;
      wishes = data;
    }
    $("wishMsg").value = "";
    $("wishOk").textContent = t("wishSent");
    renderWishes();
  } catch (err) {
    $("wishErr").textContent = (err && err.message && !/fetch/i.test(err.message)) ? err.message : t("netErr");
  } finally { $("wishBtn").disabled = false; }
});

/* start */
(async function init() {
  try {
    if (demo) {
      invite = { ...DEMO_INVITE, ...(token === "demo-public" ? { is_public: true, name: "" } : {}) };
    } else if (!token) {
      throw new Error("no code");
    } else {
      sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
      const { data, error } = await sb.rpc("get_invite", { p_token: token });
      if (error || !data) throw new Error("not found");
      invite = data;
      // someone who already RSVP'd through the public link gets their own invite back
      if (invite.is_public) {
        let mine = null; try { mine = localStorage.getItem("af_invite"); } catch {}
        if (mine && mine !== token) {
          const r = await sb.rpc("get_invite", { p_token: mine });
          if (!r.error && r.data) { invite = r.data; token = mine; history.replaceState(null, "", linkFor(mine)); }
        }
      }
    }
  } catch {
    lang = params.get("lang") === "en" ? "en" : "ms";
    $("loading").classList.add("hidden");
    $("notFound").classList.remove("hidden");
    document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
    return;
  }
  lang = params.get("lang") || invite.language || "ms";
  if (!T[lang]) lang = "ms";
  $("loading").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("wishName").value = invite.is_public ? "" : (invite.name || "");
  render(); prefillForm(); tick(); setInterval(tick, 1000);
  setupReveals(); setupActiveNav();
  loadWishes();
  document.body.classList.add("locked");
  $("envelope").classList.remove("hidden");
})();
</script>
